<!DOCTYPE html>
<html>
<head>
  <title>LinkedIn Automator Options</title>
  <style>
    body {
      font-family: sans-serif;
      width: 400px;
    }
    textarea {
      width: 100%;
      height: 300px;
    }
  </style>
</head>
<body>
  <h1>Configuration</h1>
  
  <h3>AI API Key</h3>
  <p>Enter your Zhipu AI API Key:</p>
  <input type="text" id="apiKey" placeholder="Enter API Key" style="width: 100%; margin-bottom: 20px;">

  <h3>Resume</h3>
  <p>Paste your resume below:</p>
  <textarea id="resume"></textarea>
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
